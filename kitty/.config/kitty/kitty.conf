font_family FiraCode Nerd Font Mono
font_size 18.0

foreground #ffffff
background #2e3436
background_tint 0.94

# i3 does the splitting, so no tabs bar or confirmation prompt.
tab_bar_style hidden
confirm_os_window_close 0
hide_window_decorations yes

# Host-specific overrides (wallpaper path); untracked.
include local.conf
