matches:
  - trigger: ":review"
    form: |-
      Review this [[lang]] code. Focus on [[focus]]. Be terse.

      [[code]]
    form_fields:
      lang:
        default: Python
      focus:
        type: choice
        values: [bugs, security, performance, readability]
      code:
        multiline: true

  - trigger: ":clip"
    replace: "Summarize this:\n\n{{clipboard}}"
    vars:
      - name: clipboard
        type: clipboard

  - trigger: ":today"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":fix"
    label: "AI: Debug and fix"
    search_terms:
      - debug
      - error
      - bug
      - fix
    replace: |-
      Please help me analyze and solve the following problem.

      <input>
      {{clip}}
      </input>
    vars:
      - name: clip
        type: clipboard

  - trigger: ":deep-qa"
    label: "AI: 苏格拉底式提问"
    form: |-
      我的困惑（发生了什么、我的理解和卡点）是：[[problem]]。先不要给建议。请对我进行一次苏格拉底式问诊，通过最多6个问题，帮我找到真正值得回答的问题。
      请遵守这些规则：1. 每次只问一个问题，根据我的回答决定下一问，不要提前给我一整套问卷；2. 优先区分我说的是可验证的事实、对事实的解释、价值判断，还是我希望实现的目标；3. 检查关键词是否含糊、我默认了哪些前提、证据来自哪里、有没有相反解释，以及结论成立或不成立分别意味着什么；4. 每次提问前，用一句话说明上一条回答让你更新了什么判断；5. 只问可能改变结论的问题。信息足够时立刻停止，不必凑满6个。
      问诊结束后，请整理出：1. 我最开始问的问题；2. 我真正想解决的问题；3. 已经确认的事实；4. 仍未验证的假设；5. 最可能改变结论的关键变量；6. 一个准确、具体、可以继续行动的新问题。
      等我确认这个新问题以后，再给出你的判断、理由和下一步行动。
    form_fields:
      problem:
        multiline: true

  - trigger: ":learning"
    label: "AI: 双层解释法"
    form: |-
      我想学习的是：[[topic]]。
      请分两层解释：
      第一层，小白版。用生活化的语言和一个具体例子，让完全没有基础的人也能听懂。
      第二层，专业版。使用准确术语，讲清核心机制、适用边界和常见误解。
      最后请整理出：1. 列出小白说法与专业术语的对应关系；2. 我最容易理解错的地方；3. 3个用于检查我是否真正理解的问题。
    form_fields:
      topic:
        multiline: true

  - trigger: ":disassemble"
    label: "AI: 拆解式学习"
    form: |-
      我想拆解的优秀范例（产品页面、网页、方案、流程说明、数据看板或其他成品）是：[[example]]。我想学会的是：[[goal]]。
      请先用一句话说明它解决了什么问题，再反向拆解它为什么有效。
      重点分析：1. 它服务谁，目标是什么；2. 它采用了什么结构或流程；3. 哪些关键选择拉开了质量差距；4. 它的完成标准是什么；5. 哪些规律可以迁移，哪些细节只适合这个案例。
      最后请给我：1. 提炼3到5条可复用规律；2. 一份可以照着执行的操作清单；3. 一个最值得先尝试的小练习。
    form_fields:
      example:
        multiline: true
      goal:
        multiline: true

  - trigger: ":is-this-true"
    label: "AI: 事实性核查"
    form: |-
      我要核查的说法是：[[claim]]。
      请先把它拆成：1. 可以被外部验证的事实；2. 从事实推出的结论；3. 其中包含的价值判断。
      对于事实部分，请联网核查来源、样本、时间和完整上下文，并标记为：1. 已证实；2. 基本成立，但需要收窄；3. 存在争议；4. 证据不足；5. 明显错误。
      仅在实际检索后声称“已核查”。关键事实附来源链接和相关日期；无法访问来源、未找到可靠证据或不能联网时，明确标记“未核实”，不要补造引用。
      在假设相关事实成立的情况下，继续检查：1. 这些事实能否推出当前结论；2. 是否藏着未经验证的假设；3. 是否混淆相关性和因果关系；4. 是否遗漏了其他解释或关键信息；5. 结论在什么条件下成立或失效。
      最后请输出：1. 哪些事实可信，哪些需要修正；2. 推理链中最关键的漏洞；3. 补强后的最合理版本；4. 我目前可以相信到什么程度。
    form_fields:
      claim:
        multiline: true

  - trigger: ":experts"
    label: "AI: 专家会诊"
    form: |-
      我的问题、已知事实、目标和现实约束是：[[problem]]。
      先不要直接给方案。请为这个问题选择3种真正互补的专业视角，并说明每种视角为什么必要。
      让每种视角分别回答：1. 它怎样重新定义这个问题；2. 它最推荐的解决路径；3. 其他视角最容易忽略的风险；4. 什么新证据会让它改变判断。
      然后让三种视角互相质疑，找出：1. 共同认可的事实；2. 真正的分歧；3. 分歧背后的不同假设。
      最后请综合输出：1. 综合后最推荐的方案；2. 适用条件；3. 最大风险；4. 退出条件；5. 第一步行动。
    form_fields:
      problem:
        multiline: true

  - trigger: ":first-principles"
    label: "AI: 第一性原理"
    form: |-
      我想解决的问题（可附原方案）是：[[problem]]。
      请用第一性原理把它拆回最底层，区分：1. 已经确认、无法绕开的基本事实；2. 习惯性接受、却没有验证过的假设；3. 真正想实现的目标；4. 现实中的资源与约束。
      暂时放下行业惯例和现成方案，只从基本事实、目标和约束出发，重新推导可行路径。
      如果提供了原方案，先判断它是否存在问题，并说明证据；没有原方案时跳过比较。
      最后请输出：1. 从基本事实重新推导出的新路径；2. 这条路径成立的前提；3. 验证它的第一步。
    form_fields:
      problem:
        multiline: true

  - trigger: ":judgment"
    label: "AI: 双向钢人论证"
    form: |-
      我需要做的决定（问题、两个选项、目标和现实约束）是：[[decision]]。
      先别急着回答，也别默认我已经把问题想清楚。请先做一次双向钢人论证：
      1. 用最完整、有力的方式，重述我真正需要做出的选择；2. 分别给出支持两个方向的最强理由、适用条件、最大收益、最大风险，以及最难回答的反对意见；3. 找出双方真正的分歧、最可能改变结论的关键变量，以及还需要补充的信息；4. 只问我一个最可能改变结论的问题。
      等我回答以后，再给出明确判断、理由、适用条件和下一步行动。
    form_fields:
      decision:
        multiline: true

  - trigger: ":project-loop"
    label: "AI: 公司项目 Agent 协作循环"
    replace: |-
      你负责本轮公司项目的总指挥，我负责必要的业务决策和人工操作。项目背景、仓库/分支、运行入口、目标、约束、本轮验收终点和授权范围如下：
      {{project.context}}

      请按“取证 → 编写 handoff → 派工 → 独立验收 → 继续回归”的循环推进。
      1. 先读项目协作规范、现有领域文档和工作树，核对正在运行的版本、实际配置及权威数据源。将我和其他 agent 的解释当作待验证假设；涉及业务语义、数据模型和范围取舍时，只问会改变方案的关键问题。优先修共享根因、复用已有能力，不用猜测映射或伪造数据掩盖问题。
      2. 优先用 playwright-cli 沿真实用户流程复现，结合接口业务返回码、请求响应、日志、数据库和流程状态取证。HTTP 200、页面上的成功提示、测试全绿都不能单独证明业务成功。先追到实际调用链和配置读取方，再判断是代码、数据还是环境问题。
      3. 每个独立问题先写编号 handoff，说明复现证据、目标、修改范围、禁止事项、验收步骤和交付要求，再派给执行 agent。要求交回改动、测试结果和未完成项，未经本轮授权不得自行提交。优先使用本机 codex，无法调用时给我转交；执行权限遵循本轮授权。改动范围互不重叠才并行，有前置依赖或涉及同一文件/方法就串行；等待时继续不冲突的取证、盘点和文档工作。
      4. agent 交回后核对工作树和新增提交，由你亲自审 diff、相关调用和测试断言，重跑必要检查。测试应能在修复前暴露真实问题、修复后通过，不能把错误调用写成预期，也不能放宽断言换取通过。在约定范围内回到原流程验收；涉及状态变化时，检查再次操作、连续往返和刷新后直接进入，避免用刷新绕过问题后就宣告修复。
      5. 需要我登录、输入凭据、执行 SQL、重启或部署时，一次说明要做什么、影响和完成后如何验证；已授权事项继续推进。分别记录“已写 SQL/已执行”“已打包/运行进程已更新”“文件已改/环境已部署”，不能混为一谈。凭据不进入命令行、日志、handoff 或仓库。
      6. 后台任务记录会话/进程、日志和交付位置；通知缺失时主动检查进程、日志、退出状态和产物。断网或中断后先核对已有改动再续接，避免重复派工、覆盖他人代码或一直空等。
      7. 用项目现有文档和简短任务记录保存业务决策、权威数据源、handoff 状态、验收证据、未决问题和下一步。新权威资料到达后重新评估先前的临时设计；小问题记待办，不自行扩大当前修复。进度汇报只说新发现、阻塞、需要我做的事和下一步，不反复复述历史。
      8. 达到本轮终点即收尾；我要求只写 handoff、不启动任务或不跑真实流程时，严格遵守。按本轮授权清理、分主题提交、推送和部署，不动无关改动。只清理本轮产生且确认可删除的临时文件和测试数据，保留交接材料。最终区分真实流程已验证、仅测试/编译通过、外部阻塞和未检查项，附后续接手需要的文档位置。
    vars:
      - name: project
        type: form
        params:
          layout: |-
            填写项目背景、仓库/分支、运行入口、目标、约束、本轮验收终点和授权范围：
            [[context]]
          fields:
            context:
              multiline: true
