# 约定：
# - 触发词互不为前缀（espanso 一匹配到较短的触发词就展开，较长的那个永远触发不了）。
# - 长提示词用 vars + type: form，表单窗口只显示要填的字段；
#   form: 简写会把整段提示词塞进表单窗口。
# - 多行字段单独成段，避免粘贴多行内容后句号和下文挤在一起。

matches:
  - trigger: ":review"
    label: "AI: Code review"
    form: |-
      Review this [[lang]] code. Focus on [[focus]]. Be terse.

      [[code]]
    form_fields:
      lang:
        default: Python
      focus:
        type: choice
        values: [bugs, security, performance, readability]
      code:
        multiline: true

  - trigger: ":clip"
    label: "AI: 总结剪贴板"
    replace: "Summarize this:\n\n{{clipboard}}"
    vars:
      - name: clipboard
        type: clipboard

  - trigger: ":today"
    label: "日期 YYYY-MM-DD"
    replace: "{{mydate}}"
    vars:
      - name: mydate
        type: date
        params:
          format: "%Y-%m-%d"

  - trigger: ":fix"
    label: "AI: 找根因并修复（附剪贴板）"
    replace: "先找到根本原因，说明证据链，再修复。不要只压住症状。\n\n{{clipboard}}"
    vars:
      - name: clipboard
        type: clipboard

  # 原触发词 :code 是 :codebase-cleaning 的前缀，导致后者无法触发。
  - trigger: ":impact"
    label: "AI: 推演二阶、三阶影响"
    replace: "不要只看这个改动的直接效果。继续推演它的二阶、三阶影响，重点看对其他模块、用户行为、系统复杂度和长期维护成本的影响。"

  - trigger: ":no-flattery"
    label: "AI: 质疑我的问题定义"
    replace: "不要默认我提出的问题定义是正确的。先分析我真正想解决的底层需求，判断我有没有把症状当成原因、把手段当成目标。如果有更值得解决的问题，直接指出来。"

  - trigger: ":design-deeper"
    label: "AI: 跨领域找解法"
    replace: "其他领域里有没有本质相同的问题？列出 2 到 3 个已有成熟解法的例子，说明哪些部分能迁移过来、哪些不适用，再和默认方案比较优劣，给出推荐。"

  - trigger: ":codebase-cleaning"
    label: "AI: 清理历史包袱"
    replace: "深入分析整个代码库的 Git 历史、关键 PR 和架构演变。找出哪些设计是有意为之，哪些是历史遗留，哪些是为了解决已经不存在的问题而引入的。列出可以安全移除的历史包袱，每项附上证据（提交、PR 或调用情况）和移除风险。先给清单，不要直接删除。"

  - trigger: ":simplify-article"
    label: "AI: 文档只留正向流程"
    replace: "文档只保留最终结论和正向执行步骤。删除试错过程、返工记录和与当前任务无关的背景，让读者只读到需要用的内容。"

  # 适用场景：整体任务反复做了几轮，局部仍不满意时，用它把局部修正到更好的结果。
  - trigger: ":systematic"
    label: "AI: 先查一手材料，再改写任务"
    replace: |-
      动手前先看一手材料，然后回答四个问题：
      1. 这一行顶尖的人会多做哪一步？不做会错在哪里？
      2. 从哪些能定位到的原始材料起手？不要用汇总和别人的结论。
      3. 用哪些叫得出名字的方法和工具？
      4. 你我之外，有什么会说「不」的东西能证明结果是对的？写明什么结果算失败。
      然后据此改写任务：交付物的数量和形态不变，只多出来源、方法和验证。改写后先给我看，我同意后再做。

  - trigger: ":doc-cleaning"
    label: "AI: 清理项目文件"
    replace: |-
      全面检查当前项目的所有文件（包括代码、脚本和文档），完成以下工作：
      1. 逐项审查代码结构是否干净、命名与结构是否统一、是否遵循单一职责原则。
      2. 删除冗余内容、废弃的历史记录和历史思考过程，只保留最终版本。
      3. 最后复核所有修改，汇总说明：发现的问题、已做的清理和调整、仍可能存在的冗余，以及需要我确认的取舍。

  - trigger: ":deep-qa"
    label: "AI: 苏格拉底式提问"
    replace: |-
      我的困惑（发生了什么、我的理解和卡点）：

      {{f.problem}}

      先不要给建议。请对我做一次苏格拉底式问诊，最多问 6 个问题，帮我找到真正值得回答的问题。
      规则：
      1. 每次只问一个问题，根据我的回答决定下一问，不要提前给我一整套问卷。
      2. 优先区分我说的是可验证的事实、对事实的解释、价值判断，还是我想实现的目标。
      3. 检查关键词是否含糊、我默认了哪些前提、证据来自哪里、有没有相反解释，以及结论成立或不成立分别意味着什么。
      4. 每次提问前，用一句话说明上一条回答让你更新了什么判断。
      5. 只问可能改变结论的问题。信息足够时立刻停止，不必凑满 6 个。
      问诊结束后，请整理：
      1. 我最开始问的问题；
      2. 我真正想解决的问题；
      3. 已经确认的事实；
      4. 仍未验证的假设；
      5. 最可能改变结论的关键变量；
      6. 一个准确、具体、可以继续行动的新问题。
      等我确认这个新问题后，再给出你的判断、理由和下一步行动。
    vars:
      - name: f
        type: form
        params:
          layout: |-
            我的困惑（发生了什么、我的理解和卡点）：
            [[problem]]
          fields:
            problem:
              multiline: true

  - trigger: ":learning"
    label: "AI: 双层解释法"
    replace: |-
      我想学习的是：

      {{f.topic}}

      请分两层解释：
      第一层，小白版。用生活化的语言和一个具体例子，让完全没有基础的人也能听懂。
      第二层，专业版。使用准确术语，讲清核心机制、适用边界和常见误解。
      最后请整理：
      1. 小白说法与专业术语的对照；
      2. 我最容易理解错的地方；
      3. 3 个检查我是否真正理解的问题。
    vars:
      - name: f
        type: form
        params:
          layout: |-
            我想学习的是：
            [[topic]]
          fields:
            topic:
              multiline: true

  - trigger: ":disassemble"
    label: "AI: 拆解式学习"
    replace: |-
      我想拆解的优秀范例：

      {{f.example}}

      我想学会的是：

      {{f.goal}}

      请先用一句话说明它解决了什么问题，再反向拆解它为什么有效。
      重点分析：
      1. 它服务谁，目标是什么；
      2. 它采用了什么结构或流程；
      3. 哪些关键选择拉开了质量差距；
      4. 它的完成标准是什么；
      5. 哪些规律可以迁移，哪些细节只适合这个案例。
      最后请给我：
      1. 3 到 5 条可复用的规律；
      2. 一份可以照着执行的操作清单；
      3. 一个最值得先尝试的小练习。
    vars:
      - name: f
        type: form
        params:
          layout: |-
            优秀范例（产品页面、网页、方案、流程说明、数据看板或其他成品）：
            [[example]]
            我想学会的是：
            [[goal]]
          fields:
            example:
              multiline: true
            goal:
              multiline: true

  - trigger: ":is-this-true"
    label: "AI: 事实核查"
    replace: |-
      我要核查的说法：

      {{f.claim}}

      请先把它拆成：1. 可以被外部验证的事实；2. 从事实推出的结论；3. 其中包含的价值判断。
      对事实部分，请联网核查来源、样本、时间和完整上下文，并标记为：1. 已证实；2. 基本成立，但需要收窄；3. 存在争议；4. 证据不足；5. 明显错误。
      只有实际检索过才能说“已核查”。关键事实附来源链接和相关日期；无法访问来源、找不到可靠证据或不能联网时，明确标记“未核实”，不要编造引用。
      假设相关事实成立，继续检查：1. 这些事实能否推出当前结论；2. 是否藏着未经验证的假设；3. 是否混淆了相关和因果；4. 是否遗漏了其他解释或关键信息；5. 结论在什么条件下成立或失效。
      最后请输出：1. 哪些事实可信，哪些需要修正；2. 推理链中最关键的漏洞；3. 补强后最合理的版本；4. 我目前可以相信到什么程度。
    vars:
      - name: f
        type: form
        params:
          layout: |-
            要核查的说法：
            [[claim]]
          fields:
            claim:
              multiline: true

  - trigger: ":experts"
    label: "AI: 专家会诊"
    replace: |-
      我的问题、已知事实、目标和现实约束：

      {{f.problem}}

      先不要直接给方案。请为这个问题选 3 种真正互补的专业视角，并说明每种视角为什么必要。
      让每种视角分别回答：1. 它怎样重新定义这个问题；2. 它最推荐的解决路径；3. 其他视角最容易忽略的风险；4. 什么新证据会让它改变判断。
      然后让三种视角互相质疑，找出：1. 共同认可的事实；2. 真正的分歧；3. 分歧背后的不同假设。
      最后综合输出：1. 最推荐的方案；2. 适用条件；3. 最大风险；4. 退出条件；5. 第一步行动。
    vars:
      - name: f
        type: form
        params:
          layout: |-
            问题、已知事实、目标和现实约束：
            [[problem]]
          fields:
            problem:
              multiline: true

  - trigger: ":first-principles"
    label: "AI: 第一性原理"
    replace: |-
      我想解决的问题（可附原方案）：

      {{f.problem}}

      请用第一性原理把它拆到最底层，区分：1. 已经确认、无法绕开的基本事实；2. 习惯性接受、却没有验证过的假设；3. 真正想实现的目标；4. 现实中的资源与约束。
      暂时放下行业惯例和现成方案，只从基本事实、目标和约束出发，重新推导可行路径。
      如果我提供了原方案，先判断它是否有问题，并说明证据；没有原方案就跳过比较。
      最后请输出：1. 从基本事实重新推导出的新路径；2. 这条路径成立的前提；3. 验证它的第一步。
    vars:
      - name: f
        type: form
        params:
          layout: |-
            要解决的问题（可附原方案）：
            [[problem]]
          fields:
            problem:
              multiline: true

  - trigger: ":judgment"
    label: "AI: 双向钢人论证"
    replace: |-
      我需要做的决定（问题、两个选项、目标和现实约束）：

      {{f.decision}}

      先别急着回答，也别默认我已经把问题想清楚。请先做一次双向钢人论证：
      1. 用最完整、有力的方式，重述我真正需要做的选择；
      2. 分别给出支持两个方向的最强理由、适用条件、最大收益、最大风险，以及最难回答的反对意见；
      3. 找出双方真正的分歧、最可能改变结论的关键变量，以及还需要补充的信息；
      4. 只问我一个最可能改变结论的问题。
      等我回答后，再给出明确判断、理由、适用条件和下一步行动。
    vars:
      - name: f
        type: form
        params:
          layout: |-
            要做的决定（问题、两个选项、目标和现实约束）：
            [[decision]]
          fields:
            decision:
              multiline: true

  - trigger: ":project-loop"
    label: "AI: 公司项目 Agent 协作循环"
    replace: |-
      你负责本轮公司项目的总指挥，我负责必要的业务决策和人工操作。项目背景、仓库/分支、运行入口、目标、约束、本轮验收终点和授权范围如下：

      {{project.context}}

      请按“取证 → 编写 handoff → 派工 → 独立验收 → 继续回归”的循环推进。
      1. 先读项目协作规范、现有领域文档和工作树，核对正在运行的版本、实际配置和权威数据源。把我和其他 agent 的解释当作待验证的假设；涉及业务语义、数据模型和范围取舍时，只问会改变方案的关键问题。优先修共享的根因、复用已有能力，不要用猜测的映射或伪造的数据掩盖问题。
      2. 优先用 playwright-cli 沿真实用户流程复现，结合接口业务返回码、请求响应、日志、数据库和流程状态取证。HTTP 200、页面上的成功提示、测试全绿都不能单独证明业务成功。先追到实际调用链和读取配置的地方，再判断是代码、数据还是环境问题。
      3. 每个独立问题先写编号 handoff，说明复现证据、目标、修改范围、禁止事项、验收步骤和交付要求，再派给执行 agent。要求交回改动、测试结果和未完成项；未经本轮授权不得自行提交。优先用本机 codex，无法调用时转交给我；执行权限遵循本轮授权。改动范围互不重叠才并行，有前置依赖或涉及同一文件/方法就串行；等待时继续做不冲突的取证、盘点和文档工作。
      4. agent 交回后核对工作树和新增提交，由你亲自审 diff、相关调用和测试断言，重跑必要的检查。测试应当在修复前能暴露真实问题、修复后通过；不能把错误调用写成预期，也不能放宽断言换取通过。在约定范围内回到原流程验收；涉及状态变化时，检查重复操作、连续往返和刷新后直接进入，不能靠刷新绕过问题就宣告修复。
      5. 需要我登录、输入凭据、执行 SQL、重启或部署时，一次说清要做什么、影响是什么、完成后如何验证；已授权的事项继续推进。“已写 SQL”和“已执行”、“已打包”和“运行进程已更新”、“文件已改”和“环境已部署”分别记录，不能混为一谈。凭据不得进入命令行、日志、handoff 或仓库。
      6. 后台任务要记录会话/进程、日志和交付位置；没收到通知时主动检查进程、日志、退出状态和产物。断网或中断后先核对已有改动再续接，避免重复派工、覆盖他人代码或一直空等。
      7. 用项目现有文档和简短的任务记录保存业务决策、权威数据源、handoff 状态、验收证据、未决问题和下一步。新的权威资料到达后，重新评估先前的临时设计；小问题记入待办，不擅自扩大当前修复的范围。进度汇报只说新发现、阻塞、需要我做的事和下一步，不反复复述历史。
      8. 达到本轮终点即收尾；我要求只写 handoff、不启动任务或不跑真实流程时，严格遵守。按本轮授权清理、分主题提交、推送和部署，不动无关的改动。只清理本轮产生且确认可删除的临时文件和测试数据，保留交接材料。最终分别列出：真实流程已验证的、仅测试/编译通过的、外部阻塞的和未检查的项，并附上后续接手需要的文档位置。
    vars:
      - name: project
        type: form
        params:
          layout: |-
            项目背景、仓库/分支、运行入口、目标、约束、本轮验收终点和授权范围：
            [[context]]
          fields:
            context:
              multiline: true
